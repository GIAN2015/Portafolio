<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".45"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <!-- ventana -->
  <rect x="60" y="50" width="1080" height="600" rx="22" fill="#111827" stroke="#1f2937"/>
  <rect x="60" y="50" width="1080" height="54" rx="22" fill="#0b1220"/>
  <circle cx="92" cy="77" r="7" fill="#ef4444"/><circle cx="114" cy="77" r="7" fill="#f59e0b"/><circle cx="136" cy="77" r="7" fill="#10b981"/>
  <text x="170" y="83" fill="#94a3b8" font-size="16">Dashboard Servicio Técnico &amp; Ventas · Looker Studio</text>
  <rect x="930" y="64" width="190" height="28" rx="14" fill="#1e3a8a" opacity=".6"/>
  <text x="1025" y="83" fill="#bfdbfe" font-size="13" text-anchor="middle">● Sync NetSuite · hace 5 min</text>
  <!-- KPIs -->
  <g font-size="14" fill="#94a3b8">
    <rect x="90" y="130" width="240" height="110" rx="16" fill="#0f172a" stroke="#1f2937"/>
    <text x="112" y="165">Casos abiertos</text><text x="112" y="215" fill="#f8fafc" font-size="40" font-weight="700">128</text><text x="250" y="215" fill="#34d399">▼ 12%</text>
    <rect x="350" y="130" width="240" height="110" rx="16" fill="#0f172a" stroke="#1f2937"/>
    <text x="372" y="165">Actividades técnicas</text><text x="372" y="215" fill="#f8fafc" font-size="40" font-weight="700">342</text><text x="505" y="215" fill="#34d399">▲ 8%</text>
    <rect x="610" y="130" width="240" height="110" rx="16" fill="#0f172a" stroke="#1f2937"/>
    <text x="632" y="165">Oportunidades</text><text x="632" y="215" fill="#f8fafc" font-size="40" font-weight="700">57</text><text x="745" y="215" fill="#34d399">▲ 15%</text>
    <rect x="870" y="130" width="240" height="110" rx="16" fill="#0f172a" stroke="#1f2937"/>
    <text x="892" y="165">Tiempo medio de cierre</text><text x="892" y="215" fill="#f8fafc" font-size="40" font-weight="700">2.4 d</text>
  </g>
  <!-- barras -->
  <rect x="90" y="260" width="500" height="360" rx="16" fill="#0f172a" stroke="#1f2937"/>
  <text x="112" y="295" fill="#e2e8f0" font-size="16" font-weight="600">Casos por mes</text>
  <g fill="url(#bar)">
    <rect x="125" y="470" width="44" height="120" rx="6"/><rect x="200" y="420" width="44" height="170" rx="6"/>
    <rect x="275" y="450" width="44" height="140" rx="6"/><rect x="350" y="380" width="44" height="210" rx="6"/>
    <rect x="425" y="400" width="44" height="190" rx="6"/><rect x="500" y="340" width="44" height="250" rx="6"/>
  </g>
  <g fill="#64748b" font-size="13" text-anchor="middle">
    <text x="147" y="608">Jun</text><text x="222" y="608">Jul</text><text x="297" y="608">Ago</text><text x="372" y="608">Sep</text><text x="447" y="608">Oct</text><text x="522" y="608">Nov</text>
  </g>
  <!-- línea -->
  <rect x="610" y="260" width="500" height="200" rx="16" fill="#0f172a" stroke="#1f2937"/>
  <text x="632" y="295" fill="#e2e8f0" font-size="16" font-weight="600">Pipeline de oportunidades (S/ miles)</text>
  <path d="M640 430 L710 410 L780 415 L850 380 L920 370 L990 340 L1080 320 L1080 445 L640 445 Z" fill="url(#area)"/>
  <path d="M640 430 L710 410 L780 415 L850 380 L920 370 L990 340 L1080 320" fill="none" stroke="#34d399" stroke-width="3"/>
  <!-- donut -->
  <rect x="610" y="475" width="500" height="145" rx="16" fill="#0f172a" stroke="#1f2937"/>
  <g transform="translate(690 548)">
    <circle r="45" fill="none" stroke="#1f2937" stroke-width="18"/>
    <circle r="45" fill="none" stroke="#60a5fa" stroke-width="18" stroke-dasharray="155 283" transform="rotate(-90)"/>
    <circle r="45" fill="none" stroke="#a78bfa" stroke-width="18" stroke-dasharray="80 283" stroke-dashoffset="-155" transform="rotate(-90)"/>
    <circle r="45" fill="none" stroke="#f59e0b" stroke-width="18" stroke-dasharray="48 283" stroke-dashoffset="-235" transform="rotate(-90)"/>
  </g>
  <g font-size="14" fill="#cbd5e1">
    <circle cx="780" cy="515" r="6" fill="#60a5fa"/><text x="795" y="520">CAD / SolidWorks · 55%</text>
    <circle cx="780" cy="548" r="6" fill="#a78bfa"/><text x="795" y="553">PDM · 28%</text>
    <circle cx="780" cy="581" r="6" fill="#f59e0b"/><text x="795" y="586">ERP · 17%</text>
  </g>
  <text x="1100" y="640" fill="#475569" font-size="12" text-anchor="end">Datos de ejemplo</text>
