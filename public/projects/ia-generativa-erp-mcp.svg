<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0b0b14"/></linearGradient></defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="140" y="50" width="920" height="600" rx="26" fill="#111019" stroke="#2e2a52"/>
  <rect x="140" y="50" width="920" height="64" rx="26" fill="#17152a"/>
  <circle cx="186" cy="82" r="16" fill="#d97757"/><text x="186" y="88" fill="#fff" font-size="16" text-anchor="middle" font-weight="700">✳</text>
  <text x="214" y="88" fill="#e2e8f0" font-size="18" font-weight="600">Asistente IA · NetSuite</text>
  <rect x="830" y="68" width="210" height="30" rx="15" fill="#064e3b"/><text x="935" y="88" fill="#6ee7b7" font-size="13" text-anchor="middle">🔒 MCP · OAuth 2.0 · solo lectura</text>
  <!-- usuario -->
  <rect x="560" y="150" width="460" height="74" rx="20" fill="#4f46e5"/>
  <text x="584" y="182" fill="#fff" font-size="17">¿Cuántas oportunidades abiertas tiene</text>
  <text x="584" y="207" fill="#fff" font-size="17">el equipo comercial este mes?</text>
  <!-- tool call -->
  <rect x="180" y="250" width="440" height="40" rx="12" fill="#1c1a33" stroke="#3730a3"/>
  <text x="200" y="276" fill="#a5b4fc" font-size="14" font-family="Consolas,monospace">⚙ netsuite.runSuiteQL( oportunidades, estado = abierta )</text>
  <!-- respuesta -->
  <rect x="180" y="306" width="620" height="300" rx="20" fill="#1a1930"/>
  <text x="204" y="342" fill="#e2e8f0" font-size="17">Hay <tspan font-weight="700" fill="#fff">24 oportunidades abiertas</tspan> por S/ 486 mil:</text>
  <g font-size="15">
    <rect x="204" y="362" width="572" height="36" fill="#25233f"/>
    <text x="220" y="386" fill="#a5b4fc">Vendedor</text><text x="470" y="386" fill="#a5b4fc">Oport.</text><text x="600" y="386" fill="#a5b4fc">Monto</text>
    <text x="220" y="424" fill="#e2e8f0">Vendedor A</text><text x="470" y="424" fill="#e2e8f0">9</text><text x="600" y="424" fill="#e2e8f0">S/ 192,400</text>
    <text x="220" y="458" fill="#e2e8f0">Vendedor B</text><text x="470" y="458" fill="#e2e8f0">8</text><text x="600" y="458" fill="#e2e8f0">S/ 171,050</text>
    <text x="220" y="492" fill="#e2e8f0">Vendedor C</text><text x="470" y="492" fill="#e2e8f0">7</text><text x="600" y="492" fill="#e2e8f0">S/ 122,550</text>
  </g>
  <text x="204" y="540" fill="#cbd5e1" font-size="16">La de mayor monto está en etapa de propuesta.</text>
  <text x="204" y="568" fill="#cbd5e1" font-size="16">¿Quieres el detalle por cliente?</text>
  <!-- input -->
  <rect x="180" y="580" width="840" height="50" rx="16" fill="#0d0c18" stroke="#2e2a52" transform="translate(0 0)" opacity="0"/>
  <text x="1040" y="635" fill="#4b5563" font-size="12" text-anchor="end">Datos de ejemplo</text>
</svg>
